          title: "და ბოლოს, ნახეთ Fizzy-ის გაცნობითი ვიდეო"
          body_html: |-
            <p>Fizzy-ში კიდევ ბევრი რამის გაკეთება შეგიძლიათ. ქვემოთ მოცემულ ვიდეოში 37signals-ის დამფუძნებელი და CEO, ჯეისონ ფრიდი, სულ რაღაც 17 წუთში გაგაცნობთ საფუძვლებს (ვიდეო ინგლისურ ენაზეა).</p>
          caption: "Fizzy-ის გაცნობა"
        passkey:
          title: "შემდეგ, დააყენეთ Passkey"
          body_html: |-
            <p>Passkey-ით უსაფრთხოდ შეხვალთ პაროლისა და ელფოსტის კოდის გარეშე. დასაყენებლად გახსენით Fizzy-ის მენიუ და გადადით „<strong>ჩემი პროფილი > Passkey-ების მართვა</strong>“-ზე. Passkey-ის გამოყენება არასავალდებულოა, თუმცა რეკომენდებულია.</p>
          alt: "Passkey-ის დამატების დემო"
          caption: "შექმენით Passkey პაროლისა და ელფოსტის კოდის გარეშე შესასვლელად"
        invite_link:
          title: "ახლა აიღეთ მოსაწვევი ბმული და მოიწვიეთ სხვა"
          body_html: |-
            <p>გახსენით Fizzy-ის მენიუ, აირჩიეთ „<strong>+ ხალხის მოწვევა</strong>“ და დააკოპირეთ მოსაწვევი ბმული. ბმული შეგიძლიათ სხვას გაუგზავნოთ, რომ თქვენს ანგარიშში თავად დარეგისტრირდეს.</p>
          alt: "მოსაწვევი ბმულის კოპირების დემო"
          caption: "მიიღეთ ბმული კოლეგების მოსაწვევად"
        home:
          title: "შემდეგ, დაბრუნდით მთავარ გვერდზე და ნახეთ აქტივობა"
          body_html: |-
            <p>დააჭირეთ „1“-ს ან ჩამოშალეთ Fizzy-ის მენიუ და აირჩიეთ „მთავარი“.</p>
          alt: "მთავარ გვერდზე გადასვლის დემო"
          caption: "დაბრუნდით მთავარზე ბოლო აქტივობის სანახავად"
        assigned:
          title: "ახლა ნახეთ თქვენზე მინიჭებული ყველა ბარათი"
          body_html: |-
            <p>ჩამოშალეთ Fizzy-ის მენიუ ეკრანის ზედა ნაწილში და აირჩიეთ „<strong>ჩემზეა მინიჭებული</strong>“, ან ნებისმიერ დროს უბრალოდ დააჭირეთ კლავიატურაზე „2“-ს.</p>
          alt: "„ჩემზეა მინიჭებული“-ზე გადასვლის დემო"
          caption: "ნახეთ ჩემზე მინიჭებული ყველა ბარათი"
        menu:
          title: "შემდეგ, გახსენით Fizzy-ის მენიუ"
          body_html: |-
            <p>Fizzy-ის მენიუთი გადაადგილდებით აპლიკაციაში. გასახსნელად დააწკაპუნეთ „<strong>Fizzy</strong>“-ზე ეკრანის ზედა ნაწილში ან დააჭირეთ კლავიატურაზე „J“-ს.</p>
          alt: "მთავარი მენიუს გახსნის დემო"
          caption: "გახსენით Fizzy-ის მენიუ"
        assign:
          title: "შემდეგ, მიანიჭეთ ბარათი საკუთარ თავს"
          body_html: |-
            <p>დააწკაპუნეთ პატარა თავის ხატულაზე „+“ ნიშნით და აირჩიეთ საკუთარი თავი.</p>
          alt: "ბარათის მინიჭების დემო"
          caption: "მიანიჭეთ საკუთარ თავს"
        tag:
          title: "ახლა დაადეთ ბარათს ტეგი „დიზაინი“ და გადაიტანეთ „დიახ“-ში"
          body_html: |-
            <p>დააწკაპუნეთ პატარა ტეგის ხატულაზე, აკრიფეთ „დიზაინი“ და აირჩიეთ „<strong>ტეგის შექმნა</strong>“. შემდეგ გადაიტანეთ ბარათი ახალ „დიახ“ სვეტში, რომელიც წინა ნაბიჯზე შექმენით.</p>
          alt: "ბარათისთვის ტეგის დადების დემო"
          caption: "დაადეთ ტეგი #დიზაინი"
        columns:
          title: "შემდეგ, შექმენით კიდევ ორი სვეტი"
          body_html: |-
            <ol>
              <li>ერთს დაარქვით „დიახ“</li>
              <li>მეორეს — „მიმდინარე“</li>
            </ol>
            <p>დაბრუნდით დაფის ხედზე, დააწკაპუნეთ პატარა „+“-ზე „დასრულებული“ სვეტის მარჯვნივ, დაარქვით სვეტს სახელი, აირჩიეთ ფერი და გაიმეორეთ.</p>
            <p><br></p>
            <p>ამის შემდეგ გადაათრიეთ ბარათი „დასრულებული“ სვეტში ან აირჩიეთ „დასრულდა“ გვერდით პანელში.</p>
          alt: "სვეტების დამატების დემო"
          caption: "შექმენით კიდევ ორი სვეტი"
        not_now:
          title: "მეორე, გადაიტანეთ ბარათი „ახლა არა“-ში"
          body_html: |-
            <p>შეგიძლიათ აირჩიოთ „ახლა არა“ გვერდით პანელში, ან დაბრუნდეთ დაფის ხედზე და გადაათრიოთ ბარათი მარცხენა მხარეს მდებარე „ახლა არა“ სვეტში.</p>
            <p><br></p>
          alt: "ბარათის „ახლა არა“-ში გადატანის დემო"
          caption: "გადატანა „ახლა არა“-ში"
        rename:
          title: "პირველი, გადაარქვით ბარათს სახელი"
          body_html: |-
            <ol>
              <li>დააწკაპუნეთ სათაურზე — შეგიძლიათ გადაარქვათ ბარათს სახელი, შეცვალოთ აღწერა ან დაამატოთ მეტი ინფორმაცია.</li>
              <li>შემდეგ დააჭირეთ „დასრულებულად მონიშვნა“-ს ბარათის ბოლოში.</li>
              <li>და ბოლოს, დააჭირეთ „<strong>Playground-ზე დაბრუნება</strong>“-ს ეკრანის ზედა მარცხენა კუთხეში, რომ დაფას დაუბრუნდეთ.</li>
            </ol>
